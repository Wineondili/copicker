<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CoPicker Settings</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: transparent;
        color: light-dark(#202124, #f4f4f5);
      }

      main {
        width: min(100%, 760px);
        padding: 32px 36px 48px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .icon {
        width: 24px;
        height: 24px;
        flex: 0 0 auto;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .divider {
        height: 1px;
        margin: 24px 0;
        background: light-dark(rgb(0 0 0 / 10%), rgb(255 255 255 / 11%));
      }

      p {
        max-width: 540px;
        margin: 0;
        color: light-dark(rgb(32 33 36 / 62%), rgb(244 244 245 / 58%));
        font-size: 13px;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2.25" y="2.25" width="19.5" height="19.5" rx="4.25"
                stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          <g fill="currentColor">
            <circle cx="7" cy="7" r="1.15" />
            <circle cx="12" cy="7" r="1.15" />
            <circle cx="17" cy="7" r="1.15" />
            <circle cx="7" cy="12" r="1.15" />
            <circle cx="12" cy="12" r="1.15" />
            <circle cx="17" cy="12" r="1.15" />
            <circle cx="7" cy="17" r="1.15" />
            <circle cx="12" cy="17" r="1.15" />
            <circle cx="17" cy="17" r="1.15" />
          </g>
        </svg>
        <h1>CoPicker</h1>
      </header>
      <div class="divider" role="presentation"></div>
      <p>Settings controls will be added after their behavior and layout are finalized.</p>
    </main>
  </body>
</html>
